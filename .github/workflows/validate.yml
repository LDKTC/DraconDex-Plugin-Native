# Catches the manifest mistakes that would otherwise only surface as a failed
# install inside DraconDex. No dependencies to install — the validator is plain
# Node, and `node --check` just parses the plugin's own scripts.
name: Validate plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate manifest
        run: node scripts/validate-manifest.mjs
      - name: Parse plugin scripts
        run: |
          for f in app.js catalog.js scripts/print-catalog.mjs; do
            echo "checking $f"
            node --check "$f"
          done
      # catalog.js exists only because a file://-loaded plugin window can't
      # fetch() a sibling file (see the comment at the top of catalog.js) —
      # this is what stops its hand-kept copy from silently drifting from the
      # real source of truth, catalog.json.
      - name: Check catalog.js matches catalog.json
        run: node scripts/check-catalog-sync.mjs
      - name: Print catalog (CLI smoke test)
        run: |
          node scripts/print-catalog.mjs
          node scripts/print-catalog.mjs --preamble
