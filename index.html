<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AI Native</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Plugin windows are frameless (createPluginWindow in App-DraconDex's
       main.js sets frame:false), so the page draws its own title bar.
       .titlebar is the drag region; anything clickable inside it needs
       .no-drag or the drag region swallows the click. -->
  <header class="titlebar">
    <span class="title">AI Native</span>
    <button id="close-btn" class="no-drag icon-btn" title="Close">&#x2715;</button>
  </header>

  <main id="root">
    <p id="loading" class="notice">Reading catalog.json…</p>
    <p id="error" class="error" hidden></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
